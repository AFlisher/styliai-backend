# SEC-17.2 - secret scanning in CI.
#
# This repository is public and auto-deploys from git, so a credential that
# lands in a commit is world-readable the moment it is pushed and must be
# treated as burned even if it is force-removed minutes later. Until this
# workflow existed the only control was a developer remembering to run
# `npm test` by hand.
#
# Scan scope depends on the event, which is deliberate:
#   push / pull_request  scans only the commits being introduced - fast, and
#                        catches a new leak at the moment it arrives.
#   schedule / dispatch  scans the entire history - this is what catches a
#                        secret that arrived before this workflow existed.
#
# The action always invokes gitleaks with --redact, so a finding never echoes
# the credential itself into a run log that is public on a public repository.
#
# This is a detective control. It reports after the push has already happened;
# only GitHub push protection blocks the push itself.
name: Secret scan

on:
  push:
  pull_request:
  schedule:
    # Weekly full-history sweep. Nothing else scans commits made before this
    # workflow landed.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only. A scanner with write access to the thing it scans is a bigger
# problem than the leak it is looking for. pull-requests is needed only to
# enumerate the commits in a PR.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Both actions are pinned to a commit SHA rather than a tag. A tag is
      # mutable, and a moving tag on a security-scanning action is exactly the
      # supply-chain hole this finding exists to close.
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The scheduled scan needs every commit, and the push scan needs the
          # parent of the first pushed commit.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2, tagged 2025-04-17
        env:
          # Used only to look up the repository owner type (a license is
          # required for organisations, not for individual accounts). The job
          # permissions above keep this token read-only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the scanner binary too. Left unset, the action resolves
          # "latest" at run time - an unpinned dependency inside a carefully
          # pinned workflow.
          GITLEAKS_VERSION: 8.30.1
          # The SARIF report is a map of exactly where credential-shaped
          # strings live in a public repository, retained and downloadable for
          # 90 days. The run log already tells the owner what to act on.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_COMMENTS: false
